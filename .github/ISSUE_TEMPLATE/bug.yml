name: Bug report
description: Untranslated or garbled text, typos, crashes, graphics glitches
labels: [bug]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of bug?
      options:
        - Untranslated Chinese text
        - Text overflows the box / garbled / cut off
        - Typo or wrong translation
        - Crash, freeze or softlock
        - Launcher or install problem
        - Graphics or sound glitch
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From the release you downloaded (e.g. v1.0), or the commit if you built it yourself.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Computer
      placeholder: e.g. macOS 15 on Apple Silicon, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where in the game, and what happened
      description: Floor, menu, cutscene or character you were talking to. For text bugs, quote the English.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Screenshot and save
      description: |
        Drag files in here. A save lets us jump straight to the bug: zip the game/ folder's MAPn.HIO and WINDn.HIO
        (macOS ~/Library/Application Support/Second Save/Hiouden II/game, Windows %APPDATA%\Second Save\Hiouden II\game).
    validations:
      required: false
